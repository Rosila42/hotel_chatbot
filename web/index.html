<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel PMS Staff Assistant</title>
  <meta name="description" content="Hotel staff assistant for reception, housekeeping, and management operations.">
  <link rel="stylesheet" href="/app/style.css?v=0.1.1">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">HOTEL PMS</div>
      <h1>Staff Assistant</h1>
      <div id="context-summary" class="context-summary">Reception · Morning</div>
    </div>
    <div class="status" id="status">Connecting…</div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section>
        <h2>Staff context</h2>
        <label for="role">Role</label>
        <select id="role">
          <option value="reception">Reception</option>
          <option value="housekeeping">Housekeeping</option>
          <option value="manager">Management</option>
        </select>

        <label for="shift">Reception shift</label>
        <select id="shift">
          <option value="">Not specified</option>
          <option value="morning">Morning</option>
          <option value="afternoon">Afternoon</option>
          <option value="night">Night</option>
        </select>
        <button type="button" id="morning-mode-btn" class="mode-button">Start Reception Morning Demo</button>
      </section>

      <section>
        <h2>Capabilities</h2>
        <div id="capabilities" class="capabilities">Loading…</div>
      </section>

      <section>
        <h2>Demo path</h2>
        <div class="demo-path">
          <span>1. Reception</span>
          <span>2. Housekeeping</span>
          <span>3. Management</span>
        </div>
      </section>

      <section>
        <h2>Suggested</h2>
        <div id="suggested-prompts" class="suggested-prompts"></div>
      </section>
    </aside>

    <section class="chat-panel">
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="composer">
        <input id="message" autocomplete="off" placeholder="Ask naturally…" maxlength="4000" aria-label="Message">
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="/app/app.js?v=0.1.1"></script>
</body>
</html>
