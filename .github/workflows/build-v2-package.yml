name: Build Hotel Chatbot V2 Ubuntu Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION: "0.1.1"

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-v2.txt
          python -m pip install pyinstaller

      - name: Run V2 tests
        run: PYTHONPATH=. pytest -v

      - name: Validate web JavaScript syntax
        run: node --check web/app.js

      - name: Build bundled executable
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name hotel-chatbot-v2 \
            --add-data "web:web" \
            --add-data "migrations:migrations" \
            --add-data "alembic.ini:." \
            desktop_app.py

      - name: Build Debian package
        run: |
          VERSION="${APP_VERSION}"
          PKG="hotel-chatbot-v2_${VERSION}_amd64"
          mkdir -p "dist/${PKG}/DEBIAN"
          mkdir -p "dist/${PKG}/opt/hotel-chatbot-v2"
          mkdir -p "dist/${PKG}/usr/share/applications"
          mkdir -p "dist/${PKG}/usr/share/icons/hicolor/scalable/apps"

          install -m 0755 dist/hotel-chatbot-v2 "dist/${PKG}/opt/hotel-chatbot-v2/hotel-chatbot-v2"
          install -m 0644 packaging/hotel-chatbot-v2.desktop "dist/${PKG}/usr/share/applications/hotel-chatbot-v2.desktop"
          install -m 0644 packaging/hotel-chatbot-v2.svg "dist/${PKG}/usr/share/icons/hicolor/scalable/apps/hotel-chatbot-v2.svg"

          cat > "dist/${PKG}/DEBIAN/control" <<EOF
          Package: hotel-chatbot-v2
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Hotel Chatbot Project
          Description: Hotel PMS Chatbot V2
           Local hotel PMS Chatbot, FAQ and automation assistant.
          EOF

          dpkg-deb --build "dist/${PKG}"

      - name: Upload Ubuntu installer
        uses: actions/upload-artifact@v4
        with:
          name: hotel-chatbot-v2-ubuntu
          path: dist/hotel-chatbot-v2_${{ env.APP_VERSION }}_amd64.deb
