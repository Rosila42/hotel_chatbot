name: V2 tests

on:
  push:
    branches:
      - feat/v2-architecture
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-v2.txt
      - name: Run tests
        run: PYTHONPATH=. pytest -v
      - name: Import FastAPI application
        run: python -c "import main; print(main.app.title)"
